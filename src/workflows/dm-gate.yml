# Copied into the app repo by /dm-init → .github/workflows/dm-gate.yml
name: dm-gate

on:
  pull_request:
    branches: [next, main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse PRs into main that are not from next
        if: github.base_ref == 'main' && github.head_ref != 'next'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "dm-gate: PRs into main must come from next (got head '$HEAD_REF')"
          exit 1

      - name: Feature PR into next — ticket ship gate or framing docs-only
        if: github.base_ref == 'next' && startsWith(github.head_ref, 'feature/')
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          ref="$HEAD_REF"
          rest="${ref#feature/}"
          base_sha="$BASE_SHA"
          changed="$(git diff --name-only "${base_sha}...HEAD" || true)"
          case "$rest" in
            */*)
              review="docs/reviews/${rest}.md"
              if [ ! -f "$review" ]; then
                echo "dm-gate: missing $review"
                exit 1
              fi
              grep -q '^Ship allowed: yes' "$review"
              story_id="${rest%%/*}"
              product="docs/product/${story_id}.md"
              if [ -f "$product" ]; then
                echo "dm-gate: product doc present ($product)"
              else
                echo "dm-gate: missing $product — ticket PRs require the story product doc"
                exit 1
              fi
              ;;
            *)
              echo "dm-gate: story framing PR — docs-only (no app code)"
              bad=0
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                case "$f" in
                  docs/*) ;;
                  *)
                    echo "dm-gate: framing PR must be docs-only; found app file: $f"
                    bad=1
                    ;;
                esac
              done <<< "$changed"
              [ "$bad" -eq 0 ]
              ;;
          esac

      - name: Release PR next → main — VERSION bumped + changelog
        if: github.base_ref == 'main' && github.head_ref == 'next'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --depth=1
          base_ver="$(git show "origin/${BASE_REF}:VERSION" 2>/dev/null | tr -d '[:space:]' || true)"
          head_ver="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
          if [ -z "$head_ver" ]; then
            echo "dm-gate: VERSION missing on next"
            exit 1
          fi
          if [ "$head_ver" = "$base_ver" ]; then
            echo "dm-gate: VERSION unchanged vs main ($head_ver) — bump before release"
            exit 1
          fi
          if [ -f CHANGELOG.md ]; then
            if ! grep -Fq "$head_ver" CHANGELOG.md; then
              echo "dm-gate: CHANGELOG.md exists but does not mention $head_ver"
              exit 1
            fi
          fi
          echo "dm-gate: VERSION $base_ver → $head_ver"
